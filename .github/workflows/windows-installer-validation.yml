name: Validate Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.html"
      - "**/*.css"
      - "release-tools/**"
      - "expo-app/assets/icon.png"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/windows-installer-validation.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dependencies and release boundaries
        shell: pwsh
        run: |
          npm audit
          node --test test-release-package-metadata.js test-desktop-security.js test-open-source-hygiene.js
          npm run backtest:contract:verify
          npm run test:quant-decision
          npm test

      - name: Build Windows packages
        run: npm run desktop:dist

      - name: Generate release manifest
        shell: pwsh
        run: ./release-tools/Build-ReleaseManifest.ps1 -ReleaseDir ./release

      - name: Install, launch, restart and uninstall
        shell: pwsh
        run: ./release-tools/Test-WindowsInstaller.ps1 -ReleaseDir ./release -OutputDir ./release-validation-output

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-validation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            release-validation-output/**
            release/SHA256SUMS.txt
            release/release-manifest.json

      - name: Upload validated release packages
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            release/A-shares-one-piece-Setup-*-x64.exe
            release/A-shares-one-piece-Portable-*-x64.exe
            release/SHA256SUMS.txt
            release/release-manifest.json
